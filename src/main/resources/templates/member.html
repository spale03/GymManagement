<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GymApp – Članovi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#0f0f17;--surface:#1a1a2e;--surface2:#23233a;--border:#2e2e48;--accent:#ff6b35;--accent2:#e8521f;--text:#e8e8f0;--muted:#8888aa;--danger:#e05252;--radius:10px;--fd:'Barlow Condensed',sans-serif;--fb:'Inter',sans-serif; }
    body { font-family: var(--fb); background: var(--bg); color: var(--text); min-height: 100vh; }
    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-family: var(--fd); font-size: 1.5rem; font-weight: 800; color: var(--accent); }
    .nav-logo span { color: var(--text); }
    .back-btn { padding: 7px 16px; background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; font-size: 0.85rem; font-weight: 600; text-decoration: none; transition: all .2s; }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .page-header h1 { font-family: var(--fd); font-size: 2rem; font-weight: 800; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 28px; }
    .card h2 { font-family: var(--fd); font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 10px 14px; text-align: left; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); border-bottom: 1px solid var(--border); }
    td { padding: 12px 14px; font-size: 0.9rem; border-bottom: 1px solid rgba(46,46,72,.6); }
    tbody tr:hover { background: var(--surface2); }
    tbody tr:last-child td { border-bottom: none; }
    .btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; border: none; cursor: pointer; text-decoration: none; transition: all .2s; font-family: var(--fb); }
    .btn-edit { background: rgba(255,107,53,.1); color: var(--accent); border: 1px solid rgba(255,107,53,.25); }
    .btn-edit:hover { background: var(--accent); color: #fff; }
    .btn-danger { background: rgba(224,82,82,.1); color: var(--danger); border: 1px solid rgba(224,82,82,.25); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent2); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1/-1; }
    label { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
    input { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--fb); font-size: 0.9rem; transition: border-color .2s; }
    input:focus { outline: none; border-color: var(--accent); }
    .form-actions { grid-column: 1/-1; display: flex; gap: 10px; margin-top: 8px; }
  </style>
</head>
<body>
<nav>
  <div class="nav-logo">GYM<span>APP</span></div>
  <a th:href="@{/admin/dashboard}" class="back-btn">← Admin panel</a>
</nav>
<div class="wrap">
  <div class="page-header"><h1>🏋️ Članovi</h1></div>

  <div class="card">
    <h2>Svi članovi</h2>
    <table>
      <thead><tr><th>ID</th><th>Ime</th><th>Email</th><th>Telefon</th><th>Akcije</th></tr></thead>
      <tbody>
        <tr th:each="m : ${members}">
          <td th:text="${m.id}"></td>
          <td th:text="${m.name}"></td>
          <td th:text="${m.email}"></td>
          <td th:text="${m.phoneNumber}"></td>
          <td>
            <a th:href="@{'/admin/members/edit/' + ${m.id}}" class="btn btn-edit">✏️ Izmeni</a>
            <a th:href="@{'/admin/members/delete/' + ${m.id}}" class="btn btn-danger" onclick="return confirm('Obrisati člana?')">🗑 Obriši</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h2 th:text="${memberForm.id != null} ? 'Izmeni člana' : 'Dodaj člana'"></h2>
    <form th:action="@{${memberForm.id != null} ? '/admin/members/edit/' + ${memberForm.id} : '/admin/members/add'}"
          th:object="${memberForm}" method="post">
      <div class="form-grid">
        <input type="hidden" th:field="*{id}"/>
        <div class="form-group">
          <label for="name">Ime</label>
          <input id="name" type="text" th:field="*{name}" required/>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" th:field="*{email}"/>
        </div>
        <div class="form-group">
          <label for="phone">Telefon</label>
          <input id="phone" type="text" th:field="*{phoneNumber}"/>
        </div>
        <div class="form-group">
          <label for="membership">Tip članstva</label>
          <input id="membership" type="text" th:field="*{membershipType}"/>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">💾 Sačuvaj</button>
          <a class="btn" style="background:transparent;border:1px solid var(--border);color:var(--muted)" th:href="@{/admin/members}">Otkaži</a>
        </div>
      </div>
    </form>
  </div>
</div>
</body>
</html>
